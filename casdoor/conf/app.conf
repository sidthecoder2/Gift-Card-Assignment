appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = mysql
dataSourceName = root:casdoor123@tcp(casdoor-db:3306)/
dbName = casdoor
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = "127.0.0.1:10808"
verificationCodeTimeout = 10
initScore = 2000
logPostOnly = true
origin =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100

# NOTE: After first boot, log in to http://localhost:8000
# with default admin / 123 and:
# 1. Create/verify an Organization (e.g. "giftcard-org")
# 2. Create an Application (e.g. "giftcard-app") linked to that org
#    - Set redirect URI to your frontend, e.g. http://localhost:5173/callback
#    - Note the Client ID + Client Secret, and the Cert (public key) — you'll need
#      these in both the backend (to validate JWTs) and frontend (to start OAuth flow)
